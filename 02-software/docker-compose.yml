services:
  # ===============================
  # VISION (comentado)
  # ===============================
  # vision:
  #   build: ./01-vision
  #   container_name: vision_node
  #   devices:
  #     - "/dev/video0:/dev/video0"
  #   network_mode: "host"
  #   restart: unless-stopped
  #   environment:
  #     - ROS_DOMAIN_ID=13
  #   volumes:
  #     - ./01-vision/src:/root/vision_node

  # ===============================
  # NAVIGATION (comentado)
  # ===============================
  # navigation:
  #   build: ./02-navigation
  #   container_name: navigation_node
  #   network_mode: host
  #   restart: unless-stopped
  #   volumes:
  #     - ./02-navigation/src:/root/navigation_node
  #   environment:
  #     - ROS_DOMAIN_ID=13

  # ===============================
  # MICRO-ROS AGENT
  # ===============================
  micro-ros-agent:
    image: microros/micro-ros-agent:humble
    container_name: micro_ros_agent
    restart: unless-stopped
    network_mode: "host"
    # environment:
    #   - ROS_DOMAIN_ID=13
    command: udp4 --port 8888

  # ===============================
  # LiDAR LAUNCHER
  # ===============================
  lidar:
    image: ros2_luloc:cam
    entrypoint: ["/ros_entrypoint.sh"]
    network_mode: host
    restart: unless-stopped
    ipc: host
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0:/dev/ttyUSB0
    group_add:
      - dialout
    command: ["ros2", "launch", "ldlidar_stl_ros2", "ld06.launch.py"]

  # ===============================
  # Servo LAUNCHER
  # ===============================
  servo_node:
    image: ros2_luloc:cam
    container_name: 02-software-servo-1
    network_mode: host
    restart: unless-stopped
    ipc: host
    privileged: true
    devices:
      - /dev/gpiochip4:/dev/gpiochip4 # En la Pi 5, el chip de las GPIO de 40 pines suele ser el 4 (RP1)
      - /dev/gpiochip0:/dev/gpiochip0
    # group_add:
    #   - gpio  # Descomenta si tu usuario del contenedor no es root (en tu caso eres root, así que no es obligatorio)
    command: ["ros2", "run", "luloc_pkg_py", "servo_suscriber"]

  # ===============================
  # cam LAUNCHER
  # ===============================
  camera_control:
    image: ros2_luloc:cam
    container_name: 02-software-camera-1
    network_mode: host
    ipc: host
    restart: unless-stopped
    privileged: true # Da acceso directo a los drivers de hardware V4L2 y PCIe de la Pi 5
    devices:
      - /dev/video0:/dev/video0 # Mapeo de la cámara principal (IMX219)
      - /dev/video11:/dev/video11 # Buffers de vídeo específicos de Raspberry Pi
      - /dev/video12:/dev/video12
      - /dev/video19:/dev/video19 # Multi-plane post-processing del PiSP de la Pi 5
      - /dev/vchiq:/dev/vchiq # Interfaz de servicios del firmware de la Pi
      - /dev/media0:/dev/media0 # Controlador de medios para el pipeline del PiSP
      - /dev/media2:/dev/media2 # Requerido para la negociación de formatos nativos
    volumes:
      - /dev/shm:/dev/shm # Memoria compartida para agilizar el paso de frames de vídeo
    environment:
      - PYTHONPATH=/root/ros2_ws_luloc/install/luloc_pkg_py/lib/python3.10/site-packages:/usr/local/lib/python3/dist-packages:$PYTHONPATH
      - LD_LIBRARY_PATH=/usr/local/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH
    command: ["ros2", "run", "luloc_pkg_py", "cam_control"]
  # ===============================
  # MQTT BROKER
  # ===============================
  message-broker:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./06-mqtt-broker/mosquitto:/mosquitto/config:ro

  # ===============================
  # INFLUXDB 3 CORE
  # ===============================
  influx-db:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ===============================
  # TELEGRAF
  # ===============================
  telegraf:
    image: telegraf
    container_name: telegraf
    hostname: telegraf
    network_mode: "host"
    pid: "host"
    restart: unless-stopped
    depends_on:
      influx-db:
        condition: service_healthy
    environment:
      # Forzamos IP local ya que 'network_mode: host' ignora el DNS del puente interno de Docker
      - INFLUXDB_HOST=127.0.0.1
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - TELEGRAF_COLLECTION_INTERVAL=${TELEGRAF_COLLECTION_INTERVAL}
      - HOSTNAME=${HOSTNAME:-telegraf_host}
    volumes:
      - ./05-telemetry/telegraf:/etc/telegraf
      - ./05-telemetry/telegraf/scripts:/etc/telegraf/scripts:ro
      - /sys/class/thermal:/sys/class/thermal:ro
    user: root

  # ===============================
  # GRAFANA
  # ===============================
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./05-telemetry/grafana/provisioning:/etc/grafana/provisioning
      - ./05-telemetry/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_DASHBOARDS_AUTO_REFRESH_INTERVALS=1s,5s,10s,30s,1m,5m,15m,30m,1h,2h,1d
    depends_on:
      - influx-db

# ===============================  # ROS 2 -> INFLUXDB BRIDGE  # ===============================  ros2-influx-bridge:    build:      context: ./05-telemetry/telegraf/scripts      dockerfile: Dockerfile.bridge    container_name: ros2_influx_bridge    network_mode: "host"    restart: unless-stopped

  # ===============================
  # ROS 2 -> INFLUXDB BRIDGE
  # ===============================
  ros2-influx-bridge:
    build:
      context: ./05-telemetry/telegraf/scripts
      dockerfile: Dockerfile.bridge
    container_name: ros2_influx_bridge
    network_mode: "host"
    restart: unless-stopped
volumes:
  influxdb-data:
  grafana-data:
